<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code 核心系统深度解析</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="presentation">
    <!-- Slide viewport -->
    <div id="slide-viewport">
      <div id="slide-container"></div>
    </div>

    <!-- Speaker notes sidebar -->
    <aside id="notes-panel">
      <div class="notes-header">
        <span>REPORT备注</span>
      </div>
      <div id="notes-content"></div>
    </aside>
  </div>

  <!-- Navigation bar -->
  <nav id="nav-bar">
    <button id="btn-prev" class="nav-btn" aria-label="上一页">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div id="nav-dots"></div>
    <span id="slide-counter"></span>
    <button id="btn-next" class="nav-btn" aria-label="下一页">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button id="btn-notes-toggle" class="nav-btn" aria-label="切换备注" title="切换备注面板">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    </button>
  </nav>

  <script src="mermaid.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
